repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types_or: [python, pyi, jupyter]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types_or: [python, pyi, jupyter]
      - id: ty
        name: ty check
        entry: uv run ty check
        language: system
        types_or: [python, pyi, jupyter]
        pass_filenames: false
